name: Preparar entrega firmada
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2
      - name: Validar sin servicios ni anuncios externos
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          npm ci --prefix routing-worker --ignore-scripts --no-audit --no-fund
          npm --prefix routing-worker test
          bash ./gradlew --no-daemon testDebugUnitTest lintDebug
      - name: Compilar producción sin claves
        env:
          ORG_GRADLE_PROJECT_routingUrl: ${{ vars.ROUTING_URL }}
          ORG_GRADLE_PROJECT_adsEnabled: ${{ vars.ADS_ENABLED || 'false' }}
          ORG_GRADLE_PROJECT_adsTestMode: 'false'
          ORG_GRADLE_PROJECT_admobAppId: ${{ vars.ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_admobBannerId: ${{ vars.ADMOB_BANNER_ID }}
        run: bash ./gradlew --no-daemon lintRelease assembleRelease bundleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-intermediate
          path: |
            app/build/outputs/apk/release/*-unsigned.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 1
  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-intermediate
          path: unsigned
      - name: Firmar sin ejecutar Gradle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_CERT_SHA256: ${{ vars.UPLOAD_CERT_SHA256 }}
        run: python tools/sign_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gps-mocker-signed-${{ github.run_number }}
          path: signed/
          if-no-files-found: error
          retention-days: 30
