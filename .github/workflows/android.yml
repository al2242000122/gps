name: Compilar APK Android

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'perf/**', 'refactor/**', 'test/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pruebas, lint y APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Configurar Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configurar Gradle y validar wrapper
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2
      - name: Configurar Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Probar rescate USB y servicio de rutas
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          node --test tools/test_map_workspace.cjs tools/test_map_vendor.cjs
          npm ci --prefix routing-worker --ignore-scripts --no-audit --no-fund
          npm audit --prefix routing-worker --audit-level=high
          npm --prefix routing-worker test
      - name: Compilar y verificar
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Subir APK de prueba
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gps-mocker-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Subir resultados de verificación
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resultados-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/outputs/previews/*.png
            app/build/outputs/store/*.png
          if-no-files-found: ignore
          retention-days: 7
